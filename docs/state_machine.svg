<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .s   { rx:24; fill:#CCFBF1; stroke:#0D9488; stroke-width:1.5 }
      .sd  { rx:24; fill:#F1F5F9; stroke:#94A3B8; stroke-width:1.5 }
      .t   { font-size:15px; font-weight:600; fill:#0F172A; text-anchor:middle }
      .lbl { font-size:12px; fill:#0D9488; font-weight:500 }
      .arr { stroke:#64748B; stroke-width:1.8; fill:none }
      .note{ font-size:12px; fill:#64748B }
    </style>
  </defs>

  <rect class="sd" x="40" y="60" width="120" height="50"/>
  <text class="t" x="100" y="91">IDLE</text>

  <line class="arr" x1="160" y1="85" x2="276" y2="85" marker-end="url(#a)"/>
  <text class="lbl" x="218" y="76" text-anchor="middle">start</text>

  <rect class="s" x="280" y="60" width="150" height="50"/>
  <text class="t" x="355" y="91">PATROLLING</text>

  <line class="arr" x1="430" y1="85" x2="536" y2="85" marker-end="url(#a)"/>
  <text class="lbl" x="483" y="76" text-anchor="middle">모든 지점 완료</text>

  <rect class="sd" x="540" y="60" width="120" height="50"/>
  <text class="t" x="600" y="91">DONE</text>

  <line class="arr" x1="335" y1="110" x2="335" y2="186" marker-end="url(#a)"/>
  <text class="lbl" x="326" y="152" text-anchor="end">stop</text>

  <line class="arr" x1="375" y1="186" x2="375" y2="114" marker-end="url(#a)"/>
  <text class="lbl" x="384" y="152">start</text>

  <rect class="sd" x="280" y="190" width="150" height="50"/>
  <text class="t" x="355" y="221">PAUSED</text>

  <text class="note" x="450" y="212">멈췄던 지점부터 이어서 진행</text>

  <path class="arr" d="M600 110 L600 270 L355 270 L355 244" marker-end="url(#a)"/>
  <text class="note" x="592" y="288" text-anchor="end">start — 처음부터 다시 순찰</text>
</svg>
