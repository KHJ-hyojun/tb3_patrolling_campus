<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box  { rx:10; stroke-width:1.5 }
      .mine { fill:#CCFBF1; stroke:#0D9488 }
      .ext  { fill:#E2E8F0; stroke:#64748B }
      .out  { fill:#FEF3C7; stroke:#D97706 }
      .t    { font-size:15px; font-weight:600; fill:#0F172A; text-anchor:middle }
      .ts   { font-size:12px; fill:#475569; text-anchor:middle }
      .lbl  { font-size:12px; fill:#0D9488; font-weight:500 }
      .arr  { stroke:#64748B; stroke-width:1.8; fill:none }
    </style>
  </defs>

  <rect class="box ext" x="40" y="30" width="170" height="44"/>
  <text class="t" x="125" y="58">사람</text>

  <line class="arr" x1="125" y1="74" x2="125" y2="106" marker-end="url(#a)"/>

  <rect class="box mine" x="40" y="110" width="170" height="52"/>
  <text class="t" x="125" y="132">control_node</text>
  <text class="ts" x="125" y="150">관제 인터페이스</text>

  <line class="arr" x1="125" y1="162" x2="125" y2="216" marker-end="url(#a)"/>
  <text class="lbl" x="136" y="194">서비스 /set_patrol</text>

  <rect class="box mine" x="40" y="220" width="170" height="60"/>
  <text class="t" x="125" y="245">patrol_node</text>
  <text class="ts" x="125" y="265">순회 · 재시도 · 상태 발행</text>

  <line class="arr" x1="210" y1="250" x2="366" y2="250" marker-end="url(#a)"/>
  <text class="lbl" x="288" y="240" text-anchor="middle">NavigateToPose 액션</text>

  <rect class="box ext" x="370" y="220" width="120" height="60"/>
  <text class="t" x="430" y="245">Nav2</text>
  <text class="ts" x="430" y="265">경로 · 제어</text>

  <line class="arr" x1="490" y1="250" x2="576" y2="250" marker-end="url(#a)"/>
  <text class="lbl" x="533" y="240" text-anchor="middle">/cmd_vel</text>

  <rect class="box ext" x="580" y="220" width="180" height="60"/>
  <text class="t" x="670" y="245">로봇 / 시뮬레이터</text>
  <text class="ts" x="670" y="265">TurtleBot3 · Gazebo</text>

  <line class="arr" x1="125" y1="280" x2="125" y2="366" marker-end="url(#a)"/>
  <text class="lbl" x="136" y="328">토픽 /patrol_status</text>

  <rect class="box mine" x="40" y="370" width="170" height="52"/>
  <text class="t" x="125" y="392">logger_node</text>
  <text class="ts" x="125" y="410">변화 감지 · 기록</text>

  <line class="arr" x1="125" y1="422" x2="125" y2="456" marker-end="url(#a)"/>

  <rect class="box out" x="40" y="460" width="170" height="44"/>
  <text class="t" x="125" y="488">CSV 파일</text>

  <line class="arr" x1="670" y1="280" x2="670" y2="366" marker-end="url(#a)"/>
  <text class="lbl" x="659" y="322" text-anchor="end">/odom /scan /cmd_vel</text>

  <rect class="box mine" x="580" y="370" width="180" height="52"/>
  <text class="t" x="670" y="392">monitor_node</text>
  <text class="ts" x="670" y="410">속도 · 장애물 감시</text>

  <line class="arr" x1="670" y1="422" x2="670" y2="456" marker-end="url(#a)"/>

  <rect class="box out" x="580" y="460" width="180" height="44"/>
  <text class="t" x="670" y="488">이상 시에만 경고</text>

  <rect class="box mine" x="278" y="530" width="14" height="14"/>
  <text x="300" y="542" font-size="12" fill="#475569">직접 만든 노드</text>
  <rect class="box ext" x="410" y="530" width="14" height="14"/>
  <text x="432" y="542" font-size="12" fill="#475569">외부 시스템</text>
  <rect class="box out" x="522" y="530" width="14" height="14"/>
  <text x="544" y="542" font-size="12" fill="#475569">산출물</text>
</svg>
